---
layout: default
title: Writing
permalink: /writing/
---
<h2 class="section-title">Writing</h2>
<ul class="post-list">
{% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y · %m · %d' }}</time>
      <span class="title">{{ post.title }}</span>
    </a>
  </li>
{% endfor %}
</ul>
